<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>巴奴会员</title>
<style>
:root{
  --color-primary:#635bff; --color-primary-hover:#523bff; --color-primary-soft:#efeefe;
  --color-brand-dark:#0a2540; --color-ink:#1a1f36; --color-ink-subtle:#425466;
  --color-accent:#0073e6; --color-focus:#635bff;
  --color-gray-900:#1a1f36; --color-gray-700:#425466; --color-gray-500:#697386;
  --color-gray-400:#8792a2; --color-gray-300:#a3accb; --color-gray-200:#e6e8eb;
  --color-gray-100:#f3f5f7; --color-gray-50:#fafbfc;
  --color-surface:#ffffff; --color-surface-sunken:#f7f9fb;
  --color-border:#e6e8eb; --color-border-strong:#cdd2dc;
  --color-success:#1aae6f; --color-warning:#f5a623; --color-danger:#e25950;
  --color-info:#635bff;
  --color-points-high-bg:#c7edcc; --color-points-high-text:#2e7d4f;
  --shadow-sm:0 1px 2px rgba(10,37,64,.08); --shadow-md:0 4px 12px rgba(10,37,64,.12);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-sans);font-size:13px;line-height:18px;color:var(--color-ink);background:var(--color-gray-50);-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;}
.container{max-width:1600px;margin:0 auto;padding:16px 16px 24px;}

/* Header */
.page-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.page-head h1{font-size:20px;font-weight:650;margin:0;color:var(--color-brand-dark);letter-spacing:-.3px;}
.page-head .sub{font-size:12px;color:var(--color-gray-500);}

/* Worksheet tabs */
.ws-bar{display:flex;align-items:flex-end;gap:2px;padding:0 4px;border-bottom:1px solid var(--color-border);margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.ws-bar::-webkit-scrollbar{height:0;}
.ws-tab{height:36px;padding:0 32px;min-width:130px;font-size:13px;color:var(--color-gray-700);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.ws-tab:hover{background:var(--color-gray-100);}
.ws-tab.active{background:#fff;color:var(--color-ink);font-weight:600;border-color:var(--color-border);border-bottom:2px solid var(--color-primary);}
.ws-tab .ws-edit{opacity:0;color:var(--color-gray-400);font-size:11px;cursor:pointer;}
.ws-tab:hover .ws-edit,.ws-tab.active .ws-edit{opacity:1;}
.ws-tab .ws-edit.ws-del-armed{opacity:1 !important;color:#e03131 !important;font-weight:700;}
.ws-add{height:36px;padding:0 10px;background:transparent;border:none;cursor:pointer;color:var(--color-primary);font-size:13px;font-weight:600;white-space:nowrap;}
.ws-add:hover{color:var(--color-primary-hover);}
.ws-rename-input{width:96px;height:22px;font-size:13px;padding:0 4px;border:1px solid var(--color-primary);border-radius:4px;outline:none;text-align:center;}
.asset tbody td.wx-hi{background:#ffd43b !important;}
.asset tbody td.wx-gray{background:#ced4da !important;}
.asset thead th.col-wx,.asset tbody td.col-wx,.asset tfoot td.col-wx{min-width:67px !important;padding-left:2px !important;padding-right:2px !important;}
/* 微信首列冻结：横向滚动时始终固定在左侧 */
table.asset thead th.col-wx{position:sticky;top:0;left:0;z-index:6;background:var(--color-gray-100) !important;}
table.asset tbody td.col-wx{position:sticky;left:0;z-index:2;background:var(--color-surface);}
table.asset tfoot td.col-wx{position:sticky;left:0;z-index:6;background:var(--color-gray-100) !important;}
.asset tbody td.col-wx .wx-badge{position:absolute;top:0;right:1px;font-size:9px;line-height:1.1;background:#e8590c;color:#fff;border-radius:8px;padding:1px 4px;font-variant-numeric:tabular-nums;pointer-events:none;z-index:2;white-space:nowrap;}
.asset thead th.col-login,.asset tbody td.col-login,.asset tfoot td.col-login{min-width:67px !important;padding-left:2px !important;padding-right:2px !important;}
.asset thead th.col-wx{white-space:nowrap;}
.asset td.col-wx .cell-text{white-space:nowrap;}
.ver-tag{position:fixed;top:4px;right:6px;z-index:999;font-size:10px;line-height:1;color:#8a94a6;background:rgba(255,255,255,.82);border:1px solid #e2e6ec;border-radius:6px;padding:2px 6px;pointer-events:none;font-variant-numeric:tabular-nums;}
table.asset thead th:first-child,table.asset tbody td:first-child,table.asset tfoot td:first-child{padding-left:3px !important;padding-right:3px !important;}

/* Action bar (bottom) */
.action-bar{display:flex;align-items:center;gap:10px;height:auto;padding:12px 12px 4px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap;}
.action-bar .spacer{flex:1;}
.input{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px;border:1px solid var(--color-border-strong);background:#fff;color:var(--color-ink);font-family:inherit;}
.input:focus{outline:none;border-color:var(--color-focus);box-shadow:0 0 0 3px rgba(99,91,255,.18);}
.input::placeholder{color:var(--color-gray-500);}
.btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:6px;font-size:11.5px;font-weight:550;border:1px solid transparent;cursor:pointer;transition:.12s;font-family:inherit;}
.btn-primary{background:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:#fff;color:var(--color-ink);border-color:var(--color-border-strong);}
.btn-secondary:hover{background:var(--color-gray-100);}
.btn-sm{height:24px;padding:2px 10px;font-size:13px;line-height:1;}
.btn-gear{height:24px;min-width:28px;padding:0 6px;border-radius:6px;font-size:15px;line-height:1;justify-content:center;color:var(--color-gray-600);background:transparent;border-color:transparent;box-shadow:none;}
.btn-gear:hover{background:var(--color-gray-100);}

/* Table */
.table-wrap{width:100%;max-height:calc(100vh - 200px);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--color-surface);border:1px solid var(--color-border);border-radius:10px;}
table.asset{width:auto;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;table-layout:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
table.asset thead th{position:sticky;top:0;z-index:2;background:var(--color-gray-100);color:var(--color-gray-700);font-weight:600;text-align:center;padding:0 5px;height:24px;vertical-align:middle;white-space:nowrap;border-bottom:1px solid var(--color-border-strong);user-select:none;}
table.asset thead th.sortable{cursor:pointer;}
table.asset thead th:hover{background:#e9edf2;}
table.asset thead th .sort-ind{color:var(--color-primary);margin-left:3px;font-size:10px;}
table.asset thead th .resizer{position:absolute;right:0;top:0;height:100%;width:8px;cursor:col-resize;z-index:4;touch-action:none;}
table.asset thead th .resizer:hover{background:var(--color-primary);opacity:.25;}
table.asset tbody td{padding:0 5px;height:22px;vertical-align:middle;white-space:nowrap;border-bottom:1px solid var(--color-border);color:var(--color-ink);}
table.asset tbody tr.selected td{background:rgba(99,91,255,.13);box-shadow:inset 3px 0 0 var(--color-primary);}
table.asset tbody tr.selected td:first-child{border-top-left-radius:4px;border-bottom-left-radius:4px;}
table.asset tbody tr.selected td:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px;}
table.asset tbody tr:nth-child(even){background:var(--color-gray-50);}
table.asset tbody tr:hover{background:var(--color-primary-soft);}
table.asset tbody tr{cursor:default;}
.c-left{text-align:center;} .c-center{text-align:center;} .c-right{text-align:center;}
td.num{text-align:center;font-weight:550;}
.cell-editor{width:100%;box-sizing:border-box;font-size:16px;font-family:inherit;padding:2px 4px;border:1px solid var(--color-primary);border-radius:4px;background:#fff;color:var(--color-ink);text-align:center;user-select:text;-webkit-user-select:text;}
.cell-editor:focus{outline:none;box-shadow:0 0 0 2px rgba(99,91,255,.25);}
.cell-editor[type=number]{-moz-appearance:textfield;appearance:textfield;}
.cell-editor[type=number]::-webkit-inner-spin-button,.cell-editor[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0;}
td.num.zero-q{background:#cdd2d9;color:#5b626b;}
td.points-high{background:var(--color-points-high-bg)!important;color:var(--color-points-high-text)!important;font-weight:600;border-radius:4px;}
td.warn{color:var(--color-warning);font-weight:600;}
.cell-text{display:inline-block;white-space:nowrap;vertical-align:middle;}
.login{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:4px 6px;margin:-4px -6px;border-radius:6px;}
.login .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.login.on .dot{background:var(--color-success);}
.login.off .dot{background:var(--color-danger);}
.code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;cursor:pointer;display:inline-block;white-space:nowrap;vertical-align:middle;}
.code:hover{color:var(--color-primary);text-decoration:underline;}
.badge{display:inline-flex;align-items:center;height:17px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;line-height:1;}
.badge-primary{background:var(--color-primary-soft);color:var(--color-primary);}
.badge-success{background:#e3f8ef;color:var(--color-success);}
.badge-neutral{background:var(--color-gray-100);color:var(--color-gray-700);}
.badge-danger{background:#fdeceb;color:var(--color-danger);}
table.asset tfoot td{height:22px;padding:0 5px;vertical-align:middle;font-weight:600;border-top:2px solid var(--color-border-strong);background:var(--color-gray-100);color:var(--color-ink);}
table.asset tfoot td.num{text-align:center;}
/* 操作列（编辑按钮） */
.row-edit{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;border:1px solid var(--color-border-strong);background:#fff;color:var(--color-gray-700);font-size:13px;cursor:pointer;line-height:1;}
.row-edit:hover{background:var(--color-primary-soft);color:var(--color-primary);border-color:var(--color-primary);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,37,64,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:12px;}
.modal-overlay.open{display:flex;}
.modal{width:460px;max-width:94vw;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 12px 40px var(--shadow-md);animation:modal-in .16s ease;}
@keyframes modal-in{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;}}
.modal h3{margin:0 0 14px;font-size:15px;font-weight:650;color:var(--color-brand-dark);}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.fld span{font-size:11.5px;color:var(--color-gray-700);font-weight:600;}
.fld input,.fld select{height:30px;padding:0 9px;font-size:12.5px;border-radius:7px;border:1px solid var(--color-border-strong);background:#fff;color:var(--color-ink);font-family:inherit;}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--color-focus);box-shadow:0 0 0 3px rgba(99,91,255,.18);}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
.settings-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px;}
.settings-list .btn{width:100%;justify-content:center;height:32px;font-size:12.5px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--color-brand-dark);color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;z-index:80;opacity:0;transition:.2s;pointer-events:none;bottom:calc(20px + env(safe-area-inset-bottom));}
.toast.show{opacity:1;}

/* ===== 移动端（手机 / iOS Safari）适配 ===== */
@media (max-width:640px){
  .container{padding:10px 8px 16px;}
  .page-head{margin-bottom:8px;}
  .page-head h1{font-size:17px;}
  /* 底部操作栏：按钮占满宽度 */
  .action-bar{margin-top:8px;gap:8px;padding:8px 4px 4px;justify-content:flex-end;}
  .action-bar .spacer{flex-basis:100%;height:0;margin:0;}
  .action-bar .btn{flex:0 0 auto;height:24px;}
  /* 表格：强制最小宽度 → 横向滚动，不挤压不变卡片 */
  .table-wrap{max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);}
  table.asset{min-width:0;}
  table.asset{font-size:12px;}
  table.asset thead th{height:23px;font-size:12px;padding:0 4px;}
  table.asset tbody td{height:23px;padding:0 4px;}
  table.asset tfoot td{height:23px;padding:0 4px;}
  .badge{height:16px;font-size:10.5px;padding:0 6px;}
  /* 输入框 16px，防止 iOS 聚焦时整页放大 */
  .input,.fld input,.fld select{font-size:16px;height:38px;}
  .modal{max-height:92dvh;padding:16px 16px 20px;}
  .fld input,.fld select{height:38px;}
  .row-edit{width:22px;height:22px;font-size:12px;}
  .ws-tab{height:42px;font-size:14px;padding:0 32px;min-width:130px;} .ws-add{height:42px;font-size:14px;}
  .ws-rename-input{height:24px;font-size:14px;}
}

/* 买单表：单元格级列宽（iOS Safari 不读 colgroup）+ 紧凑字号，手机整屏可见 */
table.asset.maidan{font-size:11px;}
table.asset.maidan thead th,table.asset.maidan tbody td,table.asset.maidan tfoot td{padding:0 1px;}
table.asset.maidan thead th{height:40px;}
table.asset.maidan tbody td{height:44px;}
table.asset.maidan tfoot td{height:40px;}
table.asset.maidan th:nth-child(1),table.asset.maidan td:nth-child(1){min-width:60px}
table.asset.maidan th:nth-child(2),table.asset.maidan td:nth-child(2){min-width:52px}
table.asset.maidan th:nth-child(3),table.asset.maidan td:nth-child(3){min-width:46px}
table.asset.maidan th:nth-child(4),table.asset.maidan td:nth-child(4){min-width:42px}
table.asset.maidan th:nth-child(5),table.asset.maidan td:nth-child(5){min-width:52px}
table.asset.maidan th:nth-child(6),table.asset.maidan td:nth-child(6){min-width:44px}
table.asset.maidan th:nth-child(7),table.asset.maidan td:nth-child(7){min-width:46px}
table.asset.maidan th:nth-child(8),table.asset.maidan td:nth-child(8){min-width:28px;width:28px}
.maidan-config{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 8px;background:var(--color-surface);border:1px solid var(--color-border);border-bottom:none;border-radius:8px 8px 0 0;}
.maidan-config .cfg-item{display:flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap;}
.maidan-config .cfg-item span{color:var(--color-ink);}
.maidan-config .cfg-input{width:60px;font-size:13px;padding:3px 4px;text-align:right;border:1px solid var(--color-border-strong);border-radius:6px;background:#fff;color:var(--color-ink);}
.maidan-config .cfg-input:focus{outline:2px solid var(--color-primary);}
.maidan-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 2px 5px;}
.maidan-block-title{font-size:12.5px;font-weight:600;color:var(--color-brand-dark);}
table.asset.maidan-new{font-size:11px;}
table.asset.maidan-new thead th,table.asset.maidan-new tbody td,table.asset.maidan-new tfoot td{padding:0 1px;}
table.asset.maidan-new thead th{height:40px;}
table.asset.maidan-new tbody td{height:44px;}
table.asset.maidan-new tfoot td{height:40px;}
table.asset.maidan-new th:nth-child(1),table.asset.maidan-new td:nth-child(1){min-width:50px}
table.asset.maidan-new th:nth-child(2),table.asset.maidan-new td:nth-child(2){min-width:50px}
table.asset.maidan-new th:nth-child(3),table.asset.maidan-new td:nth-child(3){min-width:50px}
table.asset.maidan-new th:nth-child(4),table.asset.maidan-new td:nth-child(4){min-width:56px}
table.asset.maidan-new th:nth-child(5),table.asset.maidan-new td:nth-child(5){min-width:56px}
table.asset.maidan-new th:nth-child(6),table.asset.maidan-new td:nth-child(6){min-width:56px}
table.asset.maidan-new th:nth-child(7),table.asset.maidan-new td:nth-child(7){min-width:56px}
table.asset.maidan-new th:nth-child(8),table.asset.maidan-new td:nth-child(8){min-width:50px}
table.asset.maidan-new th:nth-child(9),table.asset.maidan-new td:nth-child(9){min-width:56px}
table.asset.maidan-new th:nth-child(10),table.asset.maidan-new td:nth-child(10){min-width:56px}
table.asset.maidan-new th:nth-child(11),table.asset.maidan-new td:nth-child(11){min-width:36px;width:36px}
</style>

<body>
<div class="ver-tag" id="verTag">v58</div>
<div class="container">
  <div class="ws-bar" id="tabs"></div>

// 买单表独立字段（不与会员表共用全局 FIELDS）
// 折扣/打折券/手续费率 改为整表级 config（顶部一行），不放逐行
const MAIDAN_FIELDS=[
  {key:'原价',label:'原价',type:'money',align:'right'},
  {key:'酒水',label:'酒水',type:'money',align:'right'},
  {key:'实付',label:'实付',type:'money',align:'right',compute:true},
  {key:'手续费',label:'手续费',type:'money',align:'right',compute:true},
  {key:'无手续费',label:'无手续费',type:'money',align:'right',compute:true},
  {key:'最终折扣',label:'最终折扣',type:'pct',align:'right',compute:true},
  {key:'利润',label:'利润',type:'money',align:'right',compute:true},
];
const MAIDAN_COLS=[60,52,46,42,52,44,46];
function blankMaidanRow(){const row={};MAIDAN_FIELDS.forEach(f=>{row[f.key]='';});return row;}
// 买单表下方新计算区块：每行独立录入 券面值/券成本/优惠额/手续费率/原价，其余按新算法自动算（默认 4 行）
const NEW_MAIDAN_FIELDS=[
  {key:'券面值',label:'券面值',type:'money',align:'right'},
  {key:'券成本',label:'券成本',type:'money',align:'right'},
  {key:'优惠额',label:'优惠额',type:'money',align:'right'},
  {key:'手续费率',label:'手续费率',type:'pct',align:'right'},
  {key:'原价',label:'原价',type:'money',align:'right'},
  {key:'实付',label:'实付',type:'money',align:'right',compute:true},
  {key:'手续费',label:'手续费',type:'money',align:'right',compute:true},
  {key:'折扣',label:'折扣',type:'pct',align:'right',compute:true},
  {key:'成本',label:'成本',type:'money',align:'right',compute:true},
  {key:'利润',label:'利润',type:'money',align:'right',compute:true},
];
const NEW_MAIDAN_COLS=[50,50,50,56,56,56,56,50,56,56];
function blankNewMaidanRow(){const row={};NEW_MAIDAN_FIELDS.forEach(f=>{row[f.key]='';});return row;}

let state=load()||defaultState();

// 撤销：编辑前快照数据状态，最多保留 50 步
const undoStack=[];const MAX_UNDO=50;
function snapshot(){try{undoStack.push(JSON.stringify(state));if(undoStack.length>MAX_UNDO)undoStack.shift();}catch(e){}}
function undo(){
  if(!undoStack.length){toast('没有可撤销的操作');return;}
  try{state=JSON.parse(undoStack.pop());}catch(e){return;}
  save();renderTabs();renderTable();toast('已撤销上一步');
}

function uid(){return 'ws'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function monthKey(d){return d.getFullYear()+'-'+(d.getMonth()+1);}
function activeWs(){return state.worksheets.find(w=>w.id===state.activeWsId)||state.worksheets[0];}
function af(){return activeWs().fields||FIELDS;} // 当前表字段（买单表用自身字段，其余回退全局 FIELDS）
function fmtAmt(n){return (Math.round((Number(n)||0)*100)/100).toFixed(2);}
function calcMaidan(r){
  const ws=activeWs();const cfg=(ws&&ws.config)||{};
  const zkRaw=cfg['折扣'], couponRaw=cfg['打折券'], rateRaw=cfg['手续费率'];
  const yuanRaw=r['原价'], jiuRaw=r['酒水'];
  const yuan=Number(yuanRaw)||0,jiu=Number(jiuRaw)||0,zk=Number(zkRaw)||0;
  const coupon=Number(couponRaw)||0,rate=Number(rateRaw)||0;
  // 关键参数未填（全新材料空行）时计算列留空，由用户手动录入
  if(yuanRaw===''||yuanRaw==null||zkRaw===''||zkRaw==null||yuan<=0||zk<=0){
    return {incomplete:true,zhehou:0,fee:0,noFee:0,shifu:0,finalDisc:0,cost:0,profit:0};
  }
  const zhehou=(yuan-jiu)*zk;   // 折后菜品（酒水不打折）
  const base=zhehou+jiu;        // 含酒水小计 = 平台费基数
  const feeRaw=base*rate/100;   // 平台手续费（手续费率按百分比：填 0.6 表示 0.6%）
  const noFee=Math.ceil(base+coupon);   // 无手续费：向上取整到个位
  const fee=Math.round(feeRaw*100)/100;  // 手续费：保留两位小数（不向上取整）
  const shifu=noFee+fee;                // 实付 = 无手续费 + 手续费（整）
  const finalDisc=yuan?shifu/yuan:0;    // 最终折扣 = 实付/原价
  const cost=base*0.9;                  // 成本 = 折扣后餐费(我最后支付的金额)×0.9
  const profit=Math.round(noFee-cost-coupon); // 利润：四舍五入取整（= 无手续费 − 成本 − 打折券成本）
  return {incomplete:false,zhehou,fee,noFee,shifu,finalDisc,cost,profit};
}
// 新计算区块（每行独立）：实付=原价-优惠额；手续费=实付×手续费率(%)；折扣=实付/原价；成本=(原价-券面值)×0.91+券成本；利润=实付-手续费
function calcNewMaidan(r){
  const yuan=Number(r['原价'])||0;
  const youhui=Number(r['优惠额'])||0, face=Number(r['券面值'])||0, couponCost=Number(r['券成本'])||0, rate=Number(r['手续费率'])||0;
  if(r['原价']===''||r['原价']==null||yuan<=0){
    return {incomplete:true,shifu:0,fee:0,disc:0,cost:0,profit:0};
  }
  const shifu=yuan-youhui;
  const fee=Math.round(shifu*rate/100*100)/100;
  const disc=yuan?shifu/yuan:0;
  const cost=(yuan-face)*0.91+couponCost;
  const profit=shifu-fee;
  return {incomplete:false,shifu,fee,disc,cost,profit};
}
// 计算列单元格文本（cellHtml 与刷新重算共用，避免重复逻辑）
function cellComputeText(f,r,tbl){
  const c=(tbl===1)?calcNewMaidan(r):calcMaidan(r);
  if(c.incomplete)return '';
  if(f.key==='实付')return fmt2(c.shifu);
  if(f.key==='手续费')return fmt2(c.fee);
  if(f.key==='无手续费')return fmtMoney(c.noFee);
  if(f.key==='最终折扣')return (c.finalDisc*100).toFixed(1)+'%';
  if(f.key==='折扣')return (c.disc*100).toFixed(1)+'%';
  if(f.key==='成本')return fmt2(c.cost);
  if(f.key==='利润')return (tbl===1)?fmt2(c.profit):fmtMoney(c.profit);
  return '';
}
function fmt2(n){return (Math.round(Number(n)*100)/100).toFixed(2);}
function colWFor(ws,i){
  if(ws.colWidths&&ws.colWidths[i]!=null)return ws.colWidths[i];
  const def=(ws.fields&&ws.fields[0]&&ws.fields[0].key==='原价')?MAIDAN_COLS:colWidths;
  return def[i]!=null?def[i]:90;
}
function blankRow(){const ws=activeWs();const f=ws.fields||FIELDS;const row={};f.forEach(x=>{row[x.key]=(ws.rowDefaults&&ws.rowDefaults[x.key]!=null)?ws.rowDefaults[x.key]:'';});return row;}
// 排队券自动规则：等级为「肚神」且为主卡 → 3 张；否则空白
function syncQueue(r){ r['排队券']=(r['等级']==='肚神'&&r['主副卡']==='主卡')?3:''; }

    {微信:'小鱼',登录:'',排队券:2,'85券':1,券码:'DQ2026-8X',积分:3200,买单:'3',余额:159,生日:'08-15',生日券:0,保级日:'2026-11-02',成长值:6800,等级:'V6',主副卡:'主卡'},
    {微信:'阿强',登录:'',排队券:0,'85券':0,券码:'',积分:1200,买单:'0',余额:0,生日:'03-21',生日券:0,保级日:'2026-12-30',成长值:2100,等级:'V3',主副卡:'副卡'},
    {微信:'丽丽',登录:'',排队券:5,'85券':3,券码:'VIP88-22',积分:4500,买单:'1',余额:899,生日:'12-01',生日券:0,保级日:'2026-10-30',成长值:9100,等级:'V8',主副卡:'主卡'},
    {微信:'老王',登录:'',排队券:1,'85券':0,券码:'',积分:2800,买单:'2',余额:42,生日:'06-06',生日券:0,保级日:'2027-01-15',成长值:3300,等级:'V4',主副卡:'副卡'},
  ]};
  const ws2={id:uid(),name:'副卡表',sort:{key:null,dir:null},rows:[
    {微信:'小美',登录:'',排队券:3,'85券':2,券码:'MC-77',积分:1500,买单:'0',余额:66,生日:'09-09',生日券:0,保级日:'2026-11-20',成长值:2400,等级:'V2',主副卡:'副卡'},
    {微信:'大壮',登录:'',排队券:0,'85券':1,券码:'',积分:3100,买单:'4',余额:0,生日:'01-05',生日券:0,保级日:'2026-10-28',成长值:5200,等级:'V5',主副卡:'主卡'},
  ]};
  const ws3={id:uid(),name:'买单',fields:MAIDAN_FIELDS.slice(),colWidths:MAIDAN_COLS.slice(),config:{折扣:'0.85',打折券:25,手续费率:0.6},rowDefaults:{},sort:{key:null,dir:null},rows:[blankMaidanRow()],fields2:NEW_MAIDAN_FIELDS.slice(),rows2:[blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow()]};
  return {worksheets:[ws1,ws2,ws3],activeWsId:ws1.id,lastClearMonth:monthKey(new Date())};
}

function load(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(!s)return null;const o=JSON.parse(s);
    if(!o.worksheets||!o.worksheets.length)return null;
    if(!o.lastClearMonth)o.lastClearMonth=monthKey(new Date());
    // 迁移：买单表结构升级（折扣/打折券/手续费率 移到整表级 config，逐列改为 手续费）
    o.worksheets.forEach(ws=>{
      if(ws.fields&&ws.fields[0]&&ws.fields[0].key==='原价'){
        const rd=ws.rowDefaults||{}; const fr=(ws.rows&&ws.rows[0])||{};
        const pick=(k,d)=> (rd[k]!=null?rd[k]:(fr[k]!=null?fr[k]:d));
        ws.config={折扣:pick('折扣','0.85'),打折券:pick('打折券',25),手续费率:pick('手续费率',0.6)};
        const KEEP=['原价','酒水']; const DROP=['折扣','打折券','85券','手续费率','实付','无手续费','最终折扣','利润','手续费'];
        (ws.rows||[]).forEach(r=>{ if(!r)return; const nr={}; KEEP.forEach(k=>nr[k]=(r[k]!=null?r[k]:'')); DROP.forEach(k=>delete r[k]); Object.assign(r,nr); });
        ws.fields=MAIDAN_FIELDS.slice();
        ws.colWidths=MAIDAN_COLS.slice();
        // 新计算区块：每行独立的 10 列；兼容旧的「整表共用 config2」与「逐行 10 列」两种结构
        ws.fields2=NEW_MAIDAN_FIELDS.slice();
        ws.rows2=(ws.rows2||[]).map(r=>{const nr={};NEW_MAIDAN_FIELDS.forEach(f=>{nr[f.key]=(r&&r[f.key]!=null)?r[f.key]:''});return nr;});
        if(!ws.rows2.length)ws.rows2=[blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow()];
      }
    });
    // 确保「买单」表存在且至少有一行可填（全新空表也保证可录入，不改动已有数据）
    const maidan=o.worksheets.filter(ws=>ws.name==='买单');
    if(maidan.length===0){
      o.worksheets.push({id:uid(),name:'买单',fields:MAIDAN_FIELDS.slice(),colWidths:MAIDAN_COLS.slice(),config:{折扣:'0.85',打折券:25,手续费率:0.6},rowDefaults:{},sort:{key:null,dir:null},rows:[blankMaidanRow()],fields2:NEW_MAIDAN_FIELDS.slice(),rows2:[blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow()]});
    }else{
      if(maidan.length>1){ // 清理重复的买单表，保留数据最多的那张
        maidan.sort((a,b)=>b.rows.length-a.rows.length);
        maidan.slice(1).forEach(ws=>{const i=o.worksheets.indexOf(ws);if(i>=0)o.worksheets.splice(i,1);});
      }
      if(!maidan[0].config)maidan[0].config={折扣:'0.85',打折券:25,手续费率:0.6};
      maidan[0].fields2=NEW_MAIDAN_FIELDS.slice();
      maidan[0].rows2=(maidan[0].rows2||[]).map(r=>{const nr={};NEW_MAIDAN_FIELDS.forEach(f=>{nr[f.key]=(r&&r[f.key]!=null)?r[f.key]:''});return nr;});
      if(!maidan[0].rows2.length)maidan[0].rows2=[blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow(),blankNewMaidanRow()];
      if(maidan[0].rows.length===0)maidan[0].rows.push(blankMaidanRow());
    }
    return o;}catch(e){return null;}
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}

function toggleSort(key){
  const ws=activeWs();
  if(ws.sort.key===key){ if(ws.sort.dir==='asc')ws.sort.dir='desc'; else if(ws.sort.dir==='desc'){ws.sort.key=null;ws.sort.dir=null;} }
  else { ws.sort.key=key; ws.sort.dir='asc'; }
  save();renderTable();
}

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(n){return Math.round(Number(n)||0).toString();}
function daysUntil(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;
  const d=new Date(s+'T00:00:00');if(isNaN(d))return null;
  const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return Math.round((d-today)/86400000);
}
// 下一个生日距今天数：兼容 YYYY-MM-DD 与 MM-DD（无年份按今年，今年已过则算明年）
function birthdayDaysLeft(s){
  if(s===undefined||s===null||s==='')return null;
  s=String(s).trim();
  // 统一分隔符：10.1 / 10/1 / 10月1日 / 2025-10-01 → 10-1
  s=s.replace(/[.\/]/g,'-').replace(/[年月]/g,'-').replace(/日/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  const m=/^(\d{4})?-?(\d{1,2})-(\d{1,2})$/.exec(s);
  if(!m)return null;
  const mm=+m[2],dd=+m[3];
  if(mm<1||mm>12||dd<1||dd>31)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const yr=today.getFullYear();
  // 取今年/明年/去年中"离今天最近的那个生日"，返回有符号天数（负=已过的生日距今天数）
  let best=null;
  [yr,yr+1,yr-1].forEach(y=>{
    const b=new Date(y,mm-1,dd);
    const d=Math.round((b-today)/86400000);
    if(best===null||Math.abs(d)<Math.abs(best))best=d;
  });
  return best;
}
function sortType(f){return (f.type==='num'||f.type==='points'||f.type==='money')?'num':'text';}

// ---- Render ----
function renderTabs(){
  const el=document.getElementById('tabs');let h='';
  state.worksheets.forEach(w=>{
    const active=w.id===state.activeWsId?' active':'';
    h+=`<div class="ws-tab${active}" data-id="${w.id}" title="双击或长按重命名"><span class="ws-name">${escapeHtml(w.name)}</span><span class="ws-edit" data-act="del" data-id="${w.id}">✕</span></div>`;
  });
  h+=`<button class="ws-add" data-act="add">+ 新建工作表</button>`;
  el.innerHTML=h;
}

function renderMaidanConfig(ws){
  const cfg=ws.config||{};
  const item=(k,label,ph)=>`<label class="cfg-item"><span>${label}</span><input class="cfg-input" data-key="${k}" type="number" step="0.01" inputmode="decimal" value="${escapeHtml(cfg[k]==null?'':cfg[k])}" placeholder="${ph||''}"></label>`;
  return `<div class="maidan-config">${item('折扣','折扣','0.85=85折')}${item('打折券','打折券','')}${item('手续费率','手续费率','0.6=0.6%')}</div>`;
}
function renderTable(){
  const ws=activeWs();
  let rows=ws.rows.slice();
  if(ws.sort.key==='积分'){
    const type=sortType(af().find(f=>f.key===ws.sort.key));
    const dir=ws.sort.dir==='asc'?1:-1;
    rows=rows.slice().sort((a,b)=>{let x=a[ws.sort.key],y=b[ws.sort.key];
      if(type==='num'){return ((Number(x)||0)-(Number(y)||0))*dir;}
      x=x==null?'':String(x);y=y==null?'':String(y);return x.localeCompare(y,'zh')*dir;});
  }
  const sumPoints=rows.reduce((s,r)=>s+(Number(r['积分'])||0),0);
  const sumBal=rows.reduce((s,r)=>s+(Number(r['余额'])||0),0);
  const sumQueue=rows.reduce((s,r)=>s+(Number(r['排队券'])||0),0);
  const sumBirthday=rows.reduce((s,r)=>s+(Number(r['生日券'])||0),0);
  const sumWx=rows.reduce((s,r)=>s+((r['微信']===''||r['微信']==null)?0:1),0);
  const sumShifu=rows.reduce((s,r)=>s+calcMaidan(r).shifu,0);
  const sumFee=rows.reduce((s,r)=>s+calcMaidan(r).fee,0);
  const sumNoFee=rows.reduce((s,r)=>s+calcMaidan(r).noFee,0);
  const sumProfit=rows.reduce((s,r)=>s+calcMaidan(r).profit,0);

  // 表头（含列宽 colgroup + 排序指示 + 拖拽手柄 + 操作列）
  const F=af(); const isMaidan=(F[0]&&F[0].key==='原价'); const colgroup='<colgroup>'+F.map((f,i)=>`<col data-col="${i}" style="min-width:${colWFor(ws,i)}px">`).join('')+'<col style="width:40px"></colgroup>';
  let head=colgroup+'<thead><tr>'+F.map((f,i)=>{

  // 表体（data-i 用原始行索引，避免搜索/排序后改错行）
  let body='<tbody>';
  rows.forEach(r=>{

  // 合计行（积分/余额/排队券/生日券求和，微信列统计个数，操作列留空）
  let foot='<tfoot><tr>';
  F.forEach(f=>{
    if(f.key==='微信')foot+=`<td class="num">${sumWx}</td>`;
    else if(f.key==='排队券')foot+=`<td class="num">${sumQueue}</td>`;
    else if(f.key==='积分')foot+=`<td class="num">${sumPoints}</td>`;
    else if(f.key==='余额')foot+=`<td class="num">${fmtMoney(sumBal)}</td>`;
    else if(f.key==='生日券')foot+=`<td class="num">${sumBirthday}</td>`;
    else if(f.key==='实付')foot+=`<td class="num">${fmt2(sumShifu)}</td>`;
    else if(f.key==='手续费')foot+=`<td class="num">${fmt2(sumFee)}</td>`;
    else if(f.key==='无手续费')foot+=`<td class="num">${fmtMoney(sumNoFee)}</td>`;
    else if(f.key==='利润')foot+=`<td class="num">${fmtMoney(sumProfit)}</td>`;
    else if(f.type==='num'||f.type==='points'||f.type==='money')foot+=`<td class="num"></td>`;
    else if(f.key==='登录')foot+=`<td class="col-login"></td>`;
    else foot+=`<td></td>`;
  });
  foot+='<td></td></tr></tfoot>';

  const cfgBar=isMaidan?renderMaidanConfig(ws):'';
  let html=cfgBar+'<table class="asset'+(isMaidan?' maidan maidan-legacy':'')+'">'+head+body+foot+'</table>';
  if(isMaidan&&ws.fields2)html+=renderMaidanSecondTable(ws);
  document.getElementById('tableMount').innerHTML=html;
  const subEl=document.getElementById('subInfo');
  if(subEl)subEl.textContent='当前：'+ws.name+' · 共 '+ws.rows.length+' 条（新计算 '+(ws.rows2?ws.rows2.length:0)+' 条）';
  applySelection();
}

// 买单表下方新计算区块：每行独立录入 券面值/券成本/优惠额/手续费率/原价，其余自动算
function renderMaidanSecondTable(ws){
  const fields=ws.fields2, rows=ws.rows2, tbl=1;
  const sum={实付:0,手续费:0,成本:0,利润:0};
  rows.forEach(r=>{const c=calcNewMaidan(r);if(!c.incomplete){sum.实付+=c.shifu;sum.手续费+=c.fee;sum.成本+=c.cost;sum.利润+=c.profit;}});
  const head='<thead><tr>'+fields.map(f=>`<th class="c-${f.align}" data-key="${f.key}">${escapeHtml(f.label)}</th>`).join('')+'<th class="c-center">操作</th></tr></thead>';
  let body='<tbody>';
  rows.forEach((r,oi)=>{
    body+='<tr data-i="'+oi+'" data-tbl="1">';
    fields.forEach(f=>{body+=cellHtml(f,r,oi,1);});
    body+=`<td class="c-center"><button class="row-edit" data-act="delrow" data-i="${oi}" data-tbl="1" title="删除此行">🗑</button></td>`;
    body+='</tr>';
  });
  body+='</tbody>';
  let foot='<tfoot><tr>';
  fields.forEach(f=>{
    if(f.key==='折扣')foot+='<td class="num"></td>';
    else if(f.compute)foot+=`<td class="num">${fmt2(sum[f.key]||0)}</td>`;
    else foot+='<td></td>';
  });
  foot+='<td></td></tr></tfoot>';
  const head2=`<div class="maidan-block-head"><span class="maidan-block-title">新买单计算（券面值 / 券成本 / 优惠额 / 手续费率 / 原价 每行各自填）</span><button class="btn btn-sm btn-secondary" data-act="addnewrow">+ 新增一行</button></div>`;
  return head2+'<table class="asset maidan-new">'+head+body+foot+'</table>';
}

// 仅重算买单表计算列 + 合计行（编辑顶部 config 时调用，避免重建输入框丢失焦点）
function refreshMaidanComputed(){
  const ws=activeWs();
  const isMaidan=(ws.fields&&ws.fields[0]&&ws.fields[0].key==='原价');
  if(!isMaidan)return;
  const table=document.querySelector('#tableMount table.asset.maidan-legacy');

    ws.fields.forEach((f,fi)=>{ if(f.compute&&tr.children[fi]) tr.children[fi].textContent=cellComputeText(f,r); });
  });
  const foot=table.querySelector('tfoot tr');
  if(foot){
    const sums={实付:0,手续费:0,无手续费:0,利润:0};
    ws.rows.forEach(r=>{const c=calcMaidan(r);sums.实付+=c.shifu;sums.手续费+=c.fee;sums.无手续费+=c.noFee;sums.利润+=c.profit;});
    ws.fields.forEach((f,fi)=>{ if(sums[f.key]!=null&&foot.children[fi]) foot.children[fi].textContent=(f.key==='实付'||f.key==='手续费')?fmt2(sums[f.key]):fmtMoney(sums[f.key]); });

function cellHtml(f,r,oi,tbl){
  const v=r[f.key];const attr=`data-i="${oi}" data-key="${f.key}" data-tbl="${tbl}"`;
  if(f.compute){
    return `<td class="num" ${attr}>${cellComputeText(f,r,tbl)}</td>`;
  }
  if(f.type==='discount'){
    const n=Number(v)||0;const empty=(v===''||v==null);
    return `<td class="num" ${attr}>${empty?'':(n*100).toFixed(0)+'折'}</td>`;
  }
  if(f.type==='pct'){
    const n=Number(v)||0;const empty=(v===''||v==null);
    return `<td class="num" ${attr}>${empty?'':n+'%'}</td>`;
  }
  if(f.key==='微信'){
    const bv=r['生日券'];
    const bvNum=(bv===''||bv==null)?null:Number(bv);
    const bvNonZero=bvNum!==null&&bvNum!==0;
    const dLeft=birthdayDaysLeft(r['生日']);
    const within30=dLeft!==null&&Math.abs(dLeft)<=30;
    const isMain=r['主副卡']==='主卡';
    const hi=bvNonZero&&within30&&isMain; // 生日券非0非空 + 生日前30天内(含) + 主卡
    const gray=r['等级']!=='肚神';
    const cls=hi?' wx-hi':(gray?' wx-gray':'');
    const txt=(v===''||v==null)?'':escapeHtml(v);
    const badge=hi?`<span class="wx-badge">${escapeHtml(String(bvNum))}</span>`:'';
    return `<td class="c-center col-wx${cls}" ${attr}><span class="cell-text">${txt}</span>${badge}</td>`;
  }
  if(f.key==='登录'){
    const txt=v?escapeHtml(v):'';
    return `<td class="c-center col-login" ${attr}><span class="cell-text">${txt}</span></td>`;
  }
  if(f.type==='num'){
    const n=Number(v)||0;const empty=(v===''||v==null);
    const zc=(f.key==='排队券'&&n===0)?' zero-q':'';
    const cls=empty?'num':('num'+zc);
    return `<td class="${cls}" ${attr}>${empty?'':n}</td>`;
  }
  if(f.type==='points'){
    const n=Number(v)||0;const empty=(v===''||v==null);
    let cls=empty?'num':(n>=3000?'num points-high':'num');
    return `<td class="${cls}" ${attr}>${empty?'':n}</td>`;
  }
  if(f.type==='money'){
    const n=Number(v)||0;const empty=(v===''||v==null);
    return `<td class="num" ${attr}>${empty?'':fmtMoney(v)}</td>`;
  }
  if(f.type==='code'){
    const txt=(v===''||v==null)?'—':v;
    return `<td class="c-left" ${attr}><span class="code" title="点击就地编辑券码">${escapeHtml(txt)}</span></td>`;
  }
  if(f.type==='date'){
    let cls='c-center';const d=daysUntil(v);if(d!==null&&d<=14)cls+=' warn';
    return `<td class="${cls}" ${attr}>${escapeHtml(v||'')}</td>`;
  }
  if(f.type==='badge'){
    if(!v)return `<td class="c-center" ${attr}></td>`;
    let bcls='badge-primary';
    if(f.key==='主副卡')bcls=v==='主卡'?'badge-success':'badge-neutral';
    return `<td class="c-center" ${attr}><span class="badge ${bcls}">${escapeHtml(v)}</span></td>`;
  }
  const tcls=f.align==='center'?'c-center':(f.align==='right'?'num':'c-left');
  return `<td class="${tcls}" ${attr}><span class="cell-text">${escapeHtml(v||'')}</span></td>`;
}

function startCellEdit(td,i,key,tbl){
  const ws=activeWs();
  const rows=(tbl===1)?ws.rows2:ws.rows;
  const fields=(tbl===1)?ws.fields2:ws.fields;
  const r=rows[i];const f=fields.find(x=>x.key===key);const val=r[key];

    editor='<select class="cell-editor">'+opts.map(o=>`<option value="${o}" ${String(val)===o?'selected':''}>${o}</option>`).join('')+'</select>';
  }else{
    const type=(f.type==='num'||f.type==='points'||f.type==='money'||f.type==='pct')?'number':'text';
    const step='step="1"';
    const ph=f.key==='生日'?'MM-DD':(f.key==='保级日'?'YYYY-MM-DD':'');
    editor=`<input class="cell-editor" type="${type}" ${step} value="${escapeHtml(String(val==null?'':val))}" placeholder="${ph}">`;
  }
  td.innerHTML=editor;
  const el=td.firstElementChild;el.focus();if(el.select)el.select();
  let done=false;
  const finish=(saveIt)=>{if(done)return;done=true;
    if(saveIt){
      snapshot();
      if(f.type==='money'){r[key]=el.value===''?0:Math.round(Number(el.value)||0);}
      else if(f.type==='num'||f.type==='points'){r[key]=el.value===''?'':(Number(el.value)||0);}
      else r[key]=el.value;
      save();
    }
    renderTable();
  };
  el.addEventListener('blur',()=>finish(true));
  el.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();finish(true);}
    else if(ev.key==='Escape'){ev.preventDefault();finish(false);}
  });
  if(el.tagName==='SELECT')el.addEventListener('change',()=>finish(true));
}

function fieldInput(f,val,row){
  const id='f_'+f.key;
  if(f.compute){const c=calcMaidan(row);let v='';if(!c.incomplete){if(f.key==='实付')v=fmt2(c.shifu);else if(f.key==='手续费')v=fmt2(c.fee);else if(f.key==='无手续费')v=fmtMoney(c.noFee);else if(f.key==='最终折扣')v=(c.finalDisc*100).toFixed(1)+'%';else if(f.key==='利润')v=fmtMoney(c.profit);}return `<label class="fld"><span>${f.label}</span><input id="${id}" type="text" readonly value="${v}"></label>`;}
  if(f.key==='主副卡'){return `<label class="fld"><span>${f.label}</span><select id="${id}"><option value="" ${val===''?'selected':''}>（未填）</option><option ${val==='主卡'?'selected':''}>主卡</option><option ${val==='副卡'?'selected':''}>副卡</option></select></label>`;}
  const type=(f.type==='num'||f.type==='points'||f.type==='money'||f.type==='discount'||f.type==='pct')?'number':'text';
  const step='step="1"';
  const ph=f.key==='生日'?'MM-DD':(f.key==='保级日'?'YYYY-MM-DD':(f.type==='discount'?'0.85=85折':(f.type==='pct'?'0.6 表示0.6%':'')));
  return `<label class="fld"><span>${f.label}</span><input id="${id}" type="${type}" inputmode="${type==='number'?'decimal':'text'}" ${step} value="${escapeHtml(val==null?'':val)}" placeholder="${ph}"></label>`;
}
function openModal(mode,index){
  modalMode=mode;modalIndex=index;
  const row=mode==='edit'?{...activeWs().rows[index]}:blankRow();
  document.getElementById('modalTitle').textContent=mode==='edit'?'编辑记录':'新增记录';
  document.getElementById('modalBody').innerHTML=af().map(f=>fieldInput(f,row[f.key],row)).join('');
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
// ---- 计算列公式预览（点击实付/手续费/无手续费/最终折扣/利润 单元格弹出） ----
function openFormula(i,tbl){
  const ws=activeWs();
  if(tbl===1){
    const r=ws.rows2[i];const c=calcNewMaidan(r);
    const yuan=Number(r['原价'])||0,youhui=Number(r['优惠额'])||0,face=Number(r['券面值'])||0,couponCost=Number(r['券成本'])||0,rate=Number(r['手续费率'])||0;
    document.getElementById('formulaTitle').textContent='新买单计算 · 第 '+(i+1)+' 行';
    let html;
    if(c.incomplete){
      html='<p style="margin:0;color:var(--color-gray-500)">本行「原价」未填写，计算列暂无数据。请先补全「原价」。</p>';
    }else{
      const rows=[
        ['实付','原价 − 优惠额', `${yuan} − ${youhui} = ${fmt2(c.shifu)}`],
        ['手续费','实付 × 手续费率%（保留两位小数）', `${fmt2(c.shifu)} × ${rate}% = ${fmt2(c.shifu*rate/100)} = ${fmt2(c.fee)}`],
        ['折扣','实付 ÷ 原价', `${fmt2(c.shifu)} ÷ ${yuan} = ${(c.disc*100).toFixed(1)}%`],
        ['成本','(原价 − 券面值) × 0.91 + 券成本', `(${yuan} − ${face}) × 0.91 + ${couponCost} = ${fmt2(c.cost)}`],
        ['利润','实付 − 手续费', `${fmt2(c.shifu)} − ${fmt2(c.fee)} = ${fmt2(c.profit)}`],
      ];
      html=rows.map(([k,formula,calc])=>`<div class="fld"><span>${k}</span><div style="font-size:12px;color:var(--color-ink);font-family:'SFMono-Regular',Consolas,monospace;word-break:break-all;background:var(--color-gray-50);padding:6px 8px;border-radius:6px;border:1px solid var(--color-border)">${escapeHtml(calc)}</div><div style="font-size:11px;color:var(--color-gray-400)">${escapeHtml(formula)}</div></div>`).join('');
    }
    document.getElementById('formulaBody').innerHTML=html;
    document.getElementById('formulaModal').classList.add('open');
    return;
  }
  const r=ws.rows[i];const c=calcMaidan(r);
  const cfg=ws.config||{};
  const yuan=Number(r['原价'])||0, jiu=Number(r['酒水'])||0;
  const zk=Number(cfg['折扣'])||0, coupon=Number(cfg['打折券'])||0, rate=Number(cfg['手续费率'])||0;
  document.getElementById('formulaTitle').textContent='计算公式 · 第 '+(i+1)+' 行';
  let html;
  if(c.incomplete){
    html='<p style="margin:0;color:var(--color-gray-500)">本行「原价」或顶部「折扣」未填写，计算列暂无数据。请先补全「原价」并在顶部填好「折扣」。</p>';
  }else{
    const base=c.zhehou+jiu;
    const rows=[
      ['折扣后餐费', '(原价 − 酒水) × 折扣 + 酒水', `(${yuan} − ${jiu}) × ${zk} + ${jiu} = ${fmt2(c.zhehou)} + ${jiu} = ${fmt2(base)}`],
      ['无手续费', '⌈折扣后餐费 + 打折券⌉（向上取整）', `⌈${fmt2(base)} + ${coupon}⌉ = ${fmtMoney(c.noFee)}`],
      ['手续费', '折扣后餐费 × 手续费率%（保留两位小数）', `${fmt2(base)} × ${rate}% = ${fmt2(base*rate/100)} = ${fmt2(c.fee)}`],
      ['实付', '无手续费 + 手续费', `${fmtMoney(c.noFee)} + ${fmt2(c.fee)} = ${fmt2(c.shifu)}`],
      ['最终折扣', '实付 ÷ 原价', `${fmt2(c.shifu)} ÷ ${yuan} = ${(c.finalDisc*100).toFixed(1)}%`],
      ['成本', '折扣后餐费 × 0.9', `${fmt2(base)} × 0.9 = ${fmt2(c.cost)}`],
      ['利润', '无手续费 − 成本 − 打折券（四舍五入）', `${fmtMoney(c.noFee)} − ${fmt2(c.cost)} − ${coupon} = ${fmtMoney(c.profit)}`],
    ];
    html=rows.map(([k,formula,calc])=>`<div class="fld"><span>${k}</span><div style="font-size:12px;color:var(--color-ink);font-family:'SFMono-Regular',Consolas,monospace;word-break:break-all;background:var(--color-gray-50);padding:6px 8px;border-radius:6px;border:1px solid var(--color-border)">${escapeHtml(calc)}</div><div style="font-size:11px;color:var(--color-gray-400)">${escapeHtml(formula)}</div></div>`).join('');
  }
  document.getElementById('formulaBody').innerHTML=html;
  document.getElementById('formulaModal').classList.add('open');
}
function closeFormula(){document.getElementById('formulaModal').classList.remove('open');}
function readVal(f){return document.getElementById('f_'+f.key).value;}
document.getElementById('btnCancel').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

function closeSettings(){document.getElementById('settingsModal').classList.remove('open');}
document.getElementById('btnSettings').addEventListener('click',openSettings);
document.getElementById('btnSettingsClose').addEventListener('click',closeSettings);
document.getElementById('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeSettings();});
document.getElementById('btnFormulaClose').addEventListener('click',closeFormula);
document.getElementById('formulaModal').addEventListener('click',e=>{if(e.target.id==='formulaModal')closeFormula();});
document.getElementById('btnSave').addEventListener('click',()=>{
  const F=af();const vals={};
  F.forEach(f=>{
    if(f.compute)return;
    const t=document.getElementById('f_'+f.key).value.trim();
    if(f.type==='num'||f.type==='points'||f.type==='discount'||f.type==='pct'){vals[f.key]=t===''?'':(Number(t)||0);}
    else if(f.type==='money'){vals[f.key]=t===''?'':Math.round(Number(t)||0);}
    else vals[f.key]=t;
  });
  snapshot();
  if(modalMode==='add')activeWs().rows.push(vals);
  else activeWs().rows[modalIndex]=vals;
  closeModal();save();renderTable();
});

// ---- 复制（iOS file:// 降级） ----
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));
  }else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');
  ta.value=t;ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

// ---- Monthly auto-clear for 排队券 ----
function doClear(){
  state.worksheets.forEach(w=>w.rows.forEach(r=>syncQueue(r)));
  state.lastClearMonth=monthKey(new Date());save();renderTable();
  toast('排队券已于每月 1 日 03:00 重置（肚神主卡=3，其余空白）');
}
function checkClearOnLoad(){
  const now=new Date();
  const first3=new Date(now.getFullYear(),now.getMonth(),1,3,0,0,0);
  const mk=monthKey(now);
  if(state.lastClearMonth!==mk&&now>=first3){doClear();}
}
function scheduleClear(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth()+1,1,3,0,0,0);
  setTimeout(()=>{doClear();scheduleClear();},next-now);
}

// ---- Toast ----
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

// ---- 备份导入 / 导出 ----
// 导出：整库 state（所有工作表 + 上次清零月份）存为 JSON 文件
function exportData(){
  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();const p=n=>String(n).padStart(2,'0');
  a.href=url;a.download='资产追踪备份_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('已导出备份文件');
}
// 导入：读取 JSON → 校验结构 → 覆盖当前 state 并重渲染
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const o=JSON.parse(reader.result);
      if(!o.worksheets||!Array.isArray(o.worksheets)||!o.worksheets.length){toast('备份文件格式不正确');return;}
      o.worksheets.forEach(w=>{if(!Array.isArray(w.rows))w.rows=[];if(!w.sort)w.sort={key:null,dir:null};if(!w.id)w.id=uid();if(!w.name)w.name='导入表';});
      if(!o.lastClearMonth)o.lastClearMonth=monthKey(new Date());
      if(!o.activeWsId||!o.worksheets.find(w=>w.id===o.activeWsId))o.activeWsId=o.worksheets[0].id;
      state=o;
      save();renderTabs();renderTable();
      toast('已恢复 '+o.worksheets.length+' 个工作表');
    }catch(e){toast('解析失败：不是有效备份');}
  };
  reader.readAsText(file);
}
document.getElementById('btnExport').addEventListener('click',exportData);
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importData(f);e.target.value='';});

// ---- Init ----
checkClearOnLoad();
scheduleClear();
renderTabs();
renderTable();

</script>
